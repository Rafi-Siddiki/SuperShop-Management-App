# Supershop + MySQL.
#
#   docker compose up -d                 # uses the published image from GitHub Packages
#   open http://localhost:8080
#
# Build from this source instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Optional settings (environment variables or a .env file next to this one).
# They are prefixed SUPERSHOP_ so they never clash with Laravel's own .env:
#   SUPERSHOP_PORT              host port                       (default 8080)
#   SUPERSHOP_URL               public URL                      (default http://localhost:8080)
#   SUPERSHOP_APP_KEY           Laravel APP_KEY                 (default: generated once, kept in the storage volume)
#   SUPERSHOP_DEMO              load demo data + show demo logins (default true; set false for a real shop)
#   SUPERSHOP_TIMEZONE          (default Asia/Dhaka)
#   SUPERSHOP_DB_PASSWORD       MySQL app user password
#   SUPERSHOP_DB_ROOT_PASSWORD  MySQL root password

name: supershop

services:
  app:
    image: ghcr.io/rafi-siddiki/supershop-management-app:latest
    ports:
      - "${SUPERSHOP_PORT:-8080}:80"
    environment:
      APP_URL: ${SUPERSHOP_URL:-http://localhost:8080}
      APP_KEY: ${SUPERSHOP_APP_KEY:-}
      APP_TIMEZONE: ${SUPERSHOP_TIMEZONE:-Asia/Dhaka}
      APP_DEMO: ${SUPERSHOP_DEMO:-true}
      SEED_DEMO_DATA: ${SUPERSHOP_DEMO:-true}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: supershop
      DB_USERNAME: supershop
      DB_PASSWORD: ${SUPERSHOP_DB_PASSWORD:-supershop-secret}
    volumes:
      - storage:/var/www/html/storage            # product images, sessions, generated APP_KEY
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: supershop
      MYSQL_USER: supershop
      MYSQL_PASSWORD: ${SUPERSHOP_DB_PASSWORD:-supershop-secret}
      MYSQL_ROOT_PASSWORD: ${SUPERSHOP_DB_ROOT_PASSWORD:-supershop-root-secret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  db-data:
  storage:
