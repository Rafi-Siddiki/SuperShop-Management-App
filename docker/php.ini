; Supershop overrides on top of php.ini-production
expose_php = Off
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 8M
post_max_size = 12M

; OPcache: code only changes when a new image is deployed.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Laravel sets the application timezone itself (APP_TIMEZONE).
date.timezone = UTC
